<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C in Browser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
    <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 24px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            min-height: 0;
        }

        .section {
            margin-bottom: 0;
            position: relative;
        }

        .section.grow {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #b0b0b0;
        }

        #code-editor {
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            filter: brightness(1.5);
        }

        .controls {
            display: flex;
            justify-content: center;
            padding: 0.5rem 0;
        }

        button {
            padding: 0.3rem 0.5rem;
            border: none;
            border-radius: 8px;
            background-color: #00ffd2;
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        #runBtn {
            position: absolute;
            right: 0px;
            top: 0px;
            z-index: 10;
        }

        button:hover {
            background-color: #00b8d9;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        #terminal {
            flex: 1;
            min-height: 0;
            border: 2px solid #a7a7a7;
            border-radius: 8px;
            overflow: hidden;
            background-color: #0a0a1a;
            padding: 0.5rem;
        }

        .terminal {
            height: 100%;
        }

        .xterm-helper-textarea {
            position: absolute !important;
            left: -9999em !important;
            top: 0 !important;
            width: 0 !important;
            height: 0 !important;
            opacity: 0 !important;
            z-index: -10 !important;
        }

        .xterm-width-cache-measure-container {
            position: absolute !important;
            left: -9999em !important;
            top: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .xterm-cursor-layer {
            cursor: text;
        }

        .xterm {
            cursor: text;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="code-panel" class="section grow">
            <div id="code-editor"></div>
            <button id="runBtn" onclick="runCode()" title="Compile and run">▶</button>
        </div>
        <div id="output-panel" class="section">
            <div id="terminal"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script>
        let currentJob = null;
        let pollTimer = null;
        let running = false;

        const editor = CodeMirror(document.getElementById('code-editor'), {
            value: '#include <stdio.h>\n\nint main() {\n    printf("Hello, World!\\n");\n    return 0;\n}\n',
            mode: 'text/x-csrc',
            theme: 'material-darker',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            matchBrackets: true,
            autoCloseBrackets: true,
        });

        // Size the panels first, so the terminal measures its real dimensions.
        Split(['#code-panel', '#output-panel'], {
            sizes: [50, 50],
            minSize: 150,
            cursor: 'col-resize',
            direction: 'horizontal',
            gutterSize: 6,
            onDragEnd: () => fitTerminal()
        });

        const term = new Terminal({
            cursorBlink: true,
            fontFamily: "'Fira Code', 'Courier New', monospace",
            fontSize: 32,
            theme: {
                background: '#0a0a1a',
                foreground: '#e0e0e0',
                cursor: '#00ffd2',
                selectionBackground: 'rgba(0, 210, 255, 0.28)',
                selectionInactiveBackground: 'rgba(0, 210, 255, 0.16)'
            }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitTerminal();
        term.focus();

        term.onData(data => {
            if (!currentJob) return;
            fetch('/input', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: currentJob, data })
            }).catch(() => { });
        });

        async function runCode() {
            const code = editor.getValue();
            const btn = document.getElementById('runBtn');
            if (running) return;
            running = true;
            btn.disabled = true;
            stopPolling();
            term.reset();
            term.focus();

            try {
                const response = await fetch('/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await response.json();

                if (!response.ok) {
                    term.write(data.error || 'Request failed');
                    term.write('\r\n');
                    running = false;
                    btn.disabled = false;
                    return;
                }

                currentJob = data.job_id;
                sendResize();
                pollTimer = setInterval(poll, 100);
            } catch (err) {
                term.write('Request failed: ' + err.message);
                term.write('\r\n');
                running = false;
                btn.disabled = false;
            }
        }

        async function poll() {
            const job = currentJob;
            if (!job) return;
            try {
                const response = await fetch('/output', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: job })
                });
                const data = await response.json();

                // Ignore stale responses from a previous run (the user may have
                // already started a new program while this request was in flight).
                if (currentJob !== job) return;

                if (!response.ok) {
                    term.write(data.error || 'Poll failed');
                    term.write('\r\n');
                    endRun();
                    return;
                }

                if (data.output) term.write(data.output);
                if (data.done) endRun();
            } catch (err) {
                // transient error: keep polling
            }
        }

        async function sendResize() {
            const job = currentJob;
            if (!job) return;
            const cols = term.cols;
            const rows = term.rows;
            if (!cols || !rows) return;
            try {
                await fetch('/resize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: job, cols, rows })
                });
            } catch (err) { }
        }

        function endRun() {
            stopPolling();
            currentJob = null;
            running = false;
            document.getElementById('runBtn').disabled = false;
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        function fitTerminal() {
            try {
                fitAddon.fit();
            } catch (err) { }
            sendResize();
        }

        window.addEventListener('resize', () => fitTerminal());
        window.addEventListener('load', () => fitTerminal());
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => fitTerminal());
        }

        // Any click in the terminal panel focuses the terminal, so keystrokes
        // (including Enter) reach the running program.
        document.getElementById('output-panel').addEventListener('mousedown', (e) => {
            if (e.target.closest('button')) return;
            term.focus();
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });
    </script>
</body>

</html>
