<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinbrowser</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
    <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 24px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .section {
            margin-bottom: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .section.grow {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #b0b0b0;
        }

        #code-editor {
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }

        .cm-editor {
            height: 100%;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
        }

        .cm-editor .cm-scroller {
            line-height: 1.5;
        }

        .cm-editor .cm-content {
            caret-color: #00ffd2;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
        }

        .cm-editor .cm-cursor {
            border-left-color: #00ffd2;
            border-left-width: 2px;
        }

        .cm-editor .cm-selectionBackground,
        .cm-editor.cm-focused .cm-selectionBackground {
            background-color: rgba(0, 180, 255, 0.55) !important;
        }

        .cm-editor .cm-selectionMatch,
        .cm-editor.cm-focused .cm-selectionMatch {
            background-color: rgba(0, 180, 255, 0.30) !important;
        }

        .controls {
            display: flex;
            justify-content: center;
            padding: 0.5rem 0;
        }

        button {
            padding: 0.3rem 0.5rem;
            border: none;
            border-radius: 8px;
            background-color: #00ffd2;
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: fit-content;
        }


        button:hover {
            background-color: #00b8d9;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        #terminal {
            flex: 1;
            min-height: 0;
            border-radius: 8px;
            overflow: hidden;
            padding: 0.5rem;
        }

        .terminal {
            height: 100%;
        }

        .xterm-helper-textarea {
            position: absolute !important;
            left: -9999em !important;
            top: 0 !important;
            width: 0 !important;
            height: 0 !important;
            opacity: 0 !important;
            z-index: -10 !important;
        }

        .xterm-width-cache-measure-container {
            position: absolute !important;
            left: -9999em !important;
            top: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .xterm-cursor-layer {
            cursor: text;
        }

        .xterm {
            cursor: text;
        }


        .xterm-screen {
           filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.8));
        }



        #appTitle {
            font-size: 0.9rem;
            font-weight: 700;
            color: #00ffd2;
            letter-spacing: 0.05em;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            color: #b0b0b0;
            transition: background-color 0.2s, color 0.2s;
            width: fit-content;
            padding: 20px;
        }

        .badge-detected {
            background-color: #00ffd233;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="code-panel" class="section grow">
            <span id="langBadge" class="badge">(no language detected)</span>
            <div id="code-editor"></div>
        </div>
        <div id="output-panel" class="section">
            <button id="runBtn" onclick="runCode()" title="Run">▶</button>
            <div id="terminal"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script type="module">
        // CodeMirror 6 editor.
        // Note: pin codemirror@6.0.2, the CodeMirror 6 meta-package. The bare
        // `codemirror@6` range also matches codemirror@6.65.7, which is a
        // legacy CodeMirror 5 release and has no ESM `basicSetup` export.
        import { basicSetup } from 'https://esm.sh/codemirror@6.0.2';
        import { EditorView } from 'https://esm.sh/@codemirror/view@6';
        import { EditorState, Compartment } from 'https://esm.sh/@codemirror/state@6';
        import { indentUnit, StreamLanguage, LanguageSupport } from 'https://esm.sh/@codemirror/language@6';
        import { cpp } from 'https://esm.sh/@codemirror/lang-cpp@6';
        import { python } from 'https://esm.sh/@codemirror/lang-python@6';
        import { rust } from 'https://esm.sh/@codemirror/lang-rust@6';
        import { java } from 'https://esm.sh/@codemirror/lang-java@6';
        import { haskell as haskellMode } from 'https://esm.sh/@codemirror/legacy-modes@6/mode/haskell';
        import { scheme as schemeMode } from 'https://esm.sh/@codemirror/legacy-modes@6/mode/scheme';
        import { oneDark } from 'https://esm.sh/@codemirror/theme-one-dark@6';

        // Language supports for each language id sent to the backend.
        // Note: C uses the C++ parser (lang-cpp has a single grammar for both).
        // Lisp uses the Scheme legacy mode (the backend runs Guile/Scheme).
        const SUPPORT = {
            c: () => cpp(),
            cpp: () => cpp(),
            rust: () => rust(),
            java: () => java(),
            lisp: () => new LanguageSupport(StreamLanguage.define(schemeMode)),
            haskell: () => new LanguageSupport(StreamLanguage.define(haskellMode)),
            python: () => python(),
        };

        // Same labels / ids as the backend (app.py LANGUAGES map).
        const LANGUAGES = {
            c: { label: 'C' },
            cpp: { label: 'C++' },
            rust: { label: 'Rust' },
            java: { label: 'Java' },
            lisp: { label: 'Lisp' },
            haskell: { label: 'Haskell' },
            python: { label: 'Python' },
        };

        // CodeMirror 5-style mime name per language, kept for the compat shim below.
        const CM_MODE_MIME = {
            c: 'text/x-csrc',
            cpp: 'text/x-c++src',
            rust: 'text/x-rust',
            java: 'text/x-java',
            lisp: 'text/x-scheme',
            haskell: 'text/x-haskell',
            python: 'text/x-python',
        };

        let currentLanguage = 'c';
        let detectTimer = null;
        let currentJob = null;
        let pollTimer = null;
        let running = false;

        const langComp = new Compartment();

        const DEFAULT_CODE = '#include <stdio.h>\n\nint main() {\n    printf("Hello, World!\\n");\n    return 0;\n}\n';

        const editorView = new EditorView({
            parent: document.getElementById('code-editor'),
            state: EditorState.create({
                doc: DEFAULT_CODE,
                extensions: [
                    basicSetup,
                    oneDark,
                    EditorState.tabSize.of(4),
                    indentUnit.of('    '),
                    langComp.of(cpp()),
                    EditorView.updateListener.of((update) => {
                        if (update.docChanged) {
                            clearTimeout(detectTimer);
                            detectTimer = setTimeout(updateLanguage, 250);
                        }
                    }),
                ],
            }),
        });
        editorView.focus();

        function applyLanguage(lang) {
            if (!(lang in SUPPORT)) return;
            // load can be async for legacy modes; reconfigure once resolved
            Promise.resolve(SUPPORT[lang]()).then((support) => {
                if (currentLanguage !== lang) return;
                editorView.dispatch({ effects: langComp.reconfigure(support) });
            });
        }

        function looksLikeCpp(code) {
            // highlight.js cannot reliably tell C and C++ apart (the C grammar
            // inherits from C++), so we rely on explicit C++ markers instead.
            return [
                /#include\s*<iostream>/i,
                /#include\s*<vector>/i,
                /#include\s*<string>/i,
                /#include\s*<algorithm>/i,
                /using\s+namespace\b/,
                /template\s*<\s*(?:class|typename)\b/,
                /\bstd::(?:cout|cin|cerr|endl|vector|string|map|queue|stack|list)\b/,
                /\b(?:public|private|protected)\s*:/,
                /\bcout\s*<</,
                /\bcin\s*>>/,
            ].some((re) => re.test(code));
        }

        function looksLikeLisp(code) {
            return /\((?:define|lambda|set!|write|display|newline|cond|let|let\*|letrec|begin|if|cons|car|cdr)\b/.test(code);
        }

        function looksLikeHaskell(code) {
            return /^\s*main\s*=|^\s*main\s*::|\b(?:putStrLn|getLine|putStr)\b/.test(code);
        }


        /**
         * @returns the string of the language (key of LANGUAGES) 
         */
        function detectLanguage(code) {
            // C++, Lisp and Haskell are detected by explicit markers (their
            // highlight.js relevance scores are too weak/unreliable to tell
            // them apart from C / Python). The rest use hljs relevance.
            if (looksLikeCpp(code)) return 'cpp';
            if (looksLikeLisp(code)) return 'lisp';
            if (looksLikeHaskell(code)) return 'haskell';
            let best = null;
            let bestRelevance = 0;
            for (const lang of ['c', 'python', 'rust', 'java']) {
                try {
                    const res = hljs.highlight(lang, code, { ignoreIllegals: true });
                    if (res.relevance > bestRelevance) {
                        bestRelevance = res.relevance;
                        best = lang;
                    }
                } catch (err) { }
            }
            return best;
        }

        function updateLanguage() {
            const lang = detectLanguage(editorView.state.doc.toString());
            const badge = document.getElementById('langBadge');
            if (lang) {
                currentLanguage = lang;
                badge.textContent = LANGUAGES[lang].label;
                badge.classList.add('badge-detected');
                applyLanguage(lang);
            } else {
                badge.textContent = '(no language detected)';
                badge.classList.remove('badge-detected');
            }
        }

        updateLanguage();

        // Minimal CodeMirror 5-style API shim (used by tests / helpers).
        window.view = editorView;
        window.editor = {
            setValue(code) {
                editorView.dispatch({ changes: { from: 0, to: editorView.state.doc.length, insert: code } });
            },
            getValue: () => editorView.state.doc.toString(),
            getOption: (name) => (name === 'mode' ? CM_MODE_MIME[currentLanguage] ?? null : null),
            setOption() { },
            focus: () => editorView.focus(),
            refresh: () => editorView.requestMeasure(),
        };

        // Size the panels first, so the terminal measures its real dimensions.
        Split(['#code-panel', '#output-panel'], {
            sizes: [50, 50],
            minSize: 150,
            cursor: 'col-resize',
            direction: 'horizontal',
            gutterSize: 6,
            onDragEnd: () => fitTerminal()
        });

        const term = new Terminal({
            cursorBlink: true,
            fontFamily: "'Fira Code', 'Courier New', monospace",
            fontSize: 32,
            theme: {
                background: '#0a0a1a',
                foreground: '#c0ffc0',
                cursor: '#00ffd2',
                selectionBackground: 'rgba(0, 210, 255, 0.28)',
                selectionInactiveBackground: 'rgba(0, 210, 255, 0.16)'
            }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        window.term = term;
        fitTerminal();
        term.focus();

        term.onData(data => {
            if (!currentJob) return;
            fetch('/input', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: currentJob, data })
            }).catch(() => { });
        });

        async function runCode() {
            const code = editorView.state.doc.toString();
            const runBtn = document.getElementById('runBtn');
            if (running) return;
            running = true;
            runBtn.disabled = true;
            stopPolling();
            term.reset();
            term.focus();

            try {
                const response = await fetch('/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, language: currentLanguage })
                });
                const data = await response.json();

                if (!response.ok) {
                    term.write(data.error || 'Request failed');
                    term.write('\r\n');
                    running = false;
                    runBtn.disabled = false;
                    return;
                }

                currentJob = data.job_id;
                sendResize();
                pollTimer = setInterval(poll, 100);
            } catch (err) {
                term.write('Request failed: ' + err.message);
                term.write('\r\n');
                running = false;
                runBtn.disabled = false;
            }
        }

        // The run button uses an inline onclick attribute, which can only call
        // globals; module top-level functions are not reachable from HTML.
        window.runCode = runCode;

        async function poll() {
            const job = currentJob;
            if (!job) return;
            try {
                const response = await fetch('/output', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: job })
                });
                const data = await response.json();

                // Ignore stale responses from a previous run (the user may have
                // already started a new program while this request was in flight).
                if (currentJob !== job) return;

                if (!response.ok) {
                    term.write(data.error || 'Poll failed');
                    term.write('\r\n');
                    endRun();
                    return;
                }

                if (data.output) term.write(data.output);
                if (data.done) endRun();
            } catch (err) {
                // transient error: keep polling
            }
        }

        /**
         * @description inform the server that the terminal has been resized
         */
        async function sendResize() {
            const job = currentJob;
            if (!job) return;
            const cols = term.cols;
            const rows = term.rows;
            if (!cols || !rows) return;
            try {
                await fetch('/resize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: job, cols, rows })
                });
            } catch (err) { }
        }

        function endRun() {
            stopPolling();
            currentJob = null;
            running = false;
            document.getElementById('runBtn').disabled = false;
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        function fitTerminal() {
            try {
                fitAddon.fit();
            } catch (err) { }
            sendResize();
        }

        window.addEventListener('resize', () => fitTerminal());
        window.addEventListener('load', () => fitTerminal());
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => fitTerminal());
        }
        if (window.ResizeObserver) {
            new ResizeObserver(fitTerminal).observe(document.getElementById('output-panel'));
        }

        // Any click in the terminal panel focuses the terminal, so keystrokes
        // (including Enter) reach the running program.
        document.getElementById('output-panel').addEventListener('mousedown', (e) => {
            if (e.target.closest('button')) return;
            term.focus();
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });
    </script>
</body>

</html>
