<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinbrowser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
    <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 24px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .section {
            margin-bottom: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .section.grow {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #b0b0b0;
        }

        #code-editor {
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            filter: brightness(1.5);
        }

        .controls {
            display: flex;
            justify-content: center;
            padding: 0.5rem 0;
        }

        button {
            padding: 0.3rem 0.5rem;
            border: none;
            border-radius: 8px;
            background-color: #00ffd2;
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: fit-content;
        }


        button:hover {
            background-color: #00b8d9;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        #terminal {
            flex: 1;
            min-height: 0;
            border: 2px solid #a7a7a7;
            border-radius: 8px;
            overflow: hidden;
            background-color: #0a0a1a;
            padding: 0.5rem;
        }

        .terminal {
            height: 100%;
        }

        .xterm-helper-textarea {
            position: absolute !important;
            left: -9999em !important;
            top: 0 !important;
            width: 0 !important;
            height: 0 !important;
            opacity: 0 !important;
            z-index: -10 !important;
        }

        .xterm-width-cache-measure-container {
            position: absolute !important;
            left: -9999em !important;
            top: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .xterm-cursor-layer {
            cursor: text;
        }

        .xterm {
            cursor: text;
        }


        #appTitle {
            font-size: 0.9rem;
            font-weight: 700;
            color: #00ffd2;
            letter-spacing: 0.05em;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            color: #b0b0b0;
            transition: background-color 0.2s, color 0.2s;
            width: fit-content;
            padding: 20px;
        }

        .badge-detected {
            background-color: #00ffd233;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="code-panel" class="section grow">
            <span id="langBadge" class="badge">(no language detected)</span>
            <div id="code-editor"></div>
        </div>
        <div id="output-panel" class="section">
            <button id="runBtn" onclick="runCode()" title="Run">▶</button>
            <div id="terminal"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/rust/rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/haskell/haskell.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/scheme/scheme.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script>
        // Supported languages, keyed by the id sent to the backend.
        // To add a new language, add an entry here (matching the app.py LANGUAGES map).
        const LANGUAGES = {
            c: { label: 'C', mode: 'text/x-csrc' },
            cpp: { label: 'C++', mode: 'text/x-c++src' },
            rust: { label: 'Rust', mode: 'text/x-rust' },
            java: { label: 'Java', mode: 'text/x-java' },
            lisp: { label: 'Lisp', mode: 'text/x-scheme' },
            haskell: { label: 'Haskell', mode: 'text/x-haskell' },
            python: { label: 'Python', mode: 'text/x-python' },
        };
        let currentLanguage = 'c';
        let currentJob = null;
        let pollTimer = null;
        let running = false;

        const editor = CodeMirror(document.getElementById('code-editor'), {
            value: '#include <stdio.h>\n\nint main() {\n    printf("Hello, World!\\n");\n    return 0;\n}\n',
            mode: 'text/x-csrc',
            theme: 'material-darker',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            matchBrackets: true,
            autoCloseBrackets: true,
        });

        function looksLikeCpp(code) {
            // highlight.js cannot reliably tell C and C++ apart (the C grammar
            // inherits from C++), so we rely on explicit C++ markers instead.
            return [
                /#include\s*<iostream>/i,
                /#include\s*<vector>/i,
                /#include\s*<string>/i,
                /#include\s*<algorithm>/i,
                /using\s+namespace\b/,
                /template\s*<\s*(?:class|typename)\b/,
                /\bstd::(?:cout|cin|cerr|endl|vector|string|map|queue|stack|list)\b/,
                /\b(?:public|private|protected)\s*:/,
                /\bcout\s*<</,
                /\bcin\s*>>/,
            ].some((re) => re.test(code));
        }

        function looksLikeLisp(code) {
            return /\((?:define|lambda|set!|display|newline|cond|let|let\*|letrec|begin|if|cons|car|cdr)\b/.test(code);
        }

        function looksLikeHaskell(code) {
            return /^\s*main\s*=|^\s*main\s*::|\b(?:putStrLn|getLine|putStr)\b/.test(code);
        }

        function detectLanguage(code) {
            // C++, Lisp and Haskell are detected by explicit markers (their
            // highlight.js relevance scores are too weak/unreliable to tell
            // them apart from C / Python). The rest use hljs relevance.
            if (looksLikeCpp(code)) return 'cpp';
            if (looksLikeLisp(code)) return 'lisp';
            if (looksLikeHaskell(code)) return 'haskell';
            let best = null;
            let bestRelevance = 0;
            for (const lang of ['c', 'python', 'rust', 'java']) {
                try {
                    const res = hljs.highlight(lang, code, { ignoreIllegals: true });
                    if (res.relevance > bestRelevance) {
                        bestRelevance = res.relevance;
                        best = lang;
                    }
                } catch (err) { }
            }
            return best;
        }

        let detectTimer = null;
        function updateLanguage() {
            const lang = detectLanguage(editor.getValue());
            const badge = document.getElementById('langBadge');
            if (lang) {
                currentLanguage = lang;
                badge.textContent = LANGUAGES[lang].label;
                badge.classList.add('badge-detected');
                editor.setOption('mode', LANGUAGES[lang].mode);
            } else {
                badge.textContent = '(no language detected)';
                badge.classList.remove('badge-detected');
            }
        }

        editor.on('change', () => {
            clearTimeout(detectTimer);
            detectTimer = setTimeout(updateLanguage, 250);
        });
        updateLanguage();

        // Size the panels first, so the terminal measures its real dimensions.
        Split(['#code-panel', '#output-panel'], {
            sizes: [50, 50],
            minSize: 150,
            cursor: 'col-resize',
            direction: 'horizontal',
            gutterSize: 6,
            onDragEnd: () => fitTerminal()
        });

        const term = new Terminal({
            cursorBlink: true,
            fontFamily: "'Fira Code', 'Courier New', monospace",
            fontSize: 32,
            theme: {
                background: '#0a0a1a',
                foreground: '#c0ffc0',
                cursor: '#00ffd2',
                selectionBackground: 'rgba(0, 210, 255, 0.28)',
                selectionInactiveBackground: 'rgba(0, 210, 255, 0.16)'
            }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitTerminal();
        term.focus();

        term.onData(data => {
            if (!currentJob) return;
            fetch('/input', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: currentJob, data })
            }).catch(() => { });
        });

        async function runCode() {
            const code = editor.getValue();
            const btn = document.getElementById('runBtn');
            if (running) return;
            running = true;
            btn.disabled = true;
            stopPolling();
            term.reset();
            term.focus();

            try {
                const response = await fetch('/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, language: currentLanguage })
                });
                const data = await response.json();

                if (!response.ok) {
                    term.write(data.error || 'Request failed');
                    term.write('\r\n');
                    running = false;
                    btn.disabled = false;
                    return;
                }

                currentJob = data.job_id;
                sendResize();
                pollTimer = setInterval(poll, 100);
            } catch (err) {
                term.write('Request failed: ' + err.message);
                term.write('\r\n');
                running = false;
                btn.disabled = false;
            }
        }

        async function poll() {
            const job = currentJob;
            if (!job) return;
            try {
                const response = await fetch('/output', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: job })
                });
                const data = await response.json();

                // Ignore stale responses from a previous run (the user may have
                // already started a new program while this request was in flight).
                if (currentJob !== job) return;

                if (!response.ok) {
                    term.write(data.error || 'Poll failed');
                    term.write('\r\n');
                    endRun();
                    return;
                }

                if (data.output) term.write(data.output);
                if (data.done) endRun();
            } catch (err) {
                // transient error: keep polling
            }
        }

        async function sendResize() {
            const job = currentJob;
            if (!job) return;
            const cols = term.cols;
            const rows = term.rows;
            if (!cols || !rows) return;
            try {
                await fetch('/resize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: job, cols, rows })
                });
            } catch (err) { }
        }

        function endRun() {
            stopPolling();
            currentJob = null;
            running = false;
            document.getElementById('runBtn').disabled = false;
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        function fitTerminal() {
            try {
                fitAddon.fit();
            } catch (err) { }
            sendResize();
        }

        window.addEventListener('resize', () => fitTerminal());
        window.addEventListener('load', () => fitTerminal());
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => fitTerminal());
        }
        if (window.ResizeObserver) {
            new ResizeObserver(fitTerminal).observe(document.getElementById('output-panel'));
        }

        // Any click in the terminal panel focuses the terminal, so keystrokes
        // (including Enter) reach the running program.
        document.getElementById('output-panel').addEventListener('mousedown', (e) => {
            if (e.target.closest('button')) return;
            term.focus();
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });
    </script>
</body>

</html>
