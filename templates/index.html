<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C in Browser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 24px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            min-height: 0;
        }

        .section {
            margin-bottom: 0;
            position: relative;
        }

        .section.grow {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #b0b0b0;
        }

        #code-editor {
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            filter: brightness(1.5);
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 1rem;
            border: 2px solid #a7a7a7;
            border-radius: 8px;
            background-color: #0a0a1a;
            color: #e0e0e0;
            font-family: 'Fira Code', 'Courier New', monospace;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #00d2ff;
        }

        .controls {
            display: flex;
            justify-content: center;
            padding: 0.5rem 0;
        }

        button {
            padding: 0.3rem 0.5rem;
            border: none;
            border-radius: 8px;
            background-color: #00ffd2;
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        #runBtn {
            position: absolute;
            right: 0px;
            top: 0px;
        }

        button:hover {
            background-color: #00b8d9;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #ff6b6b;
        }

        #status {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #888;
            min-height: 1.2em;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="code-panel" class="section grow">
            <div id="code-editor"></div>
            <button id="runBtn" onclick="runCode()" title="Compile and run">▶</button>
        </div>
        <div id="output-panel" class="section">
            <textarea id="output" readonly placeholder="Output will appear here..."></textarea>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script>
        const editor = CodeMirror(document.getElementById('code-editor'), {
            value: '#include <stdio.h>\n\nint main() {\n    printf("Hello, World!\\n");\n    return 0;\n}\n',
            mode: 'text/x-csrc',
            theme: 'material-darker',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            matchBrackets: true,
            autoCloseBrackets: true,
        });

        async function runCode() {
            const code = editor.getValue();
            const output = document.getElementById('output');
            //    const status = document.getElementById('status');
            const btn = document.getElementById('runBtn');

            btn.disabled = true;
            //  status.textContent = 'Compiling and running...';
            output.value = '';

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });

                const data = await response.json();

                let result = '';
                if (data.output) result += data.output;
                if (data.error) result += (result ? '\n' : '') + data.error;

                output.value = result || '(no output)';
                output.classList.toggle('error', !!data.error && !data.output);
                // status.textContent = data.error ? 'Error occurred' : 'Finished';
            } catch (err) {
                output.value = 'Request failed: ' + err.message;
                output.classList.add('error');
                //   status.textContent = 'Request failed';
            } finally {
                btn.disabled = false;
            }
        }

        editor.setOption('extraKeys', {
            'Ctrl-Enter': () => runCode(),
            'Cmd-Enter': () => runCode(),
        });


        Split(['#code-panel', '#output-panel'], {
            sizes: [50, 50],
            minSize: 150,
            cursor: 'col-resize',
            direction: 'horizontal',
            gutterSize: 6
        });
    </script>
</body>

</html>
